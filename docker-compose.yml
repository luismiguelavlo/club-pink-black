services:
  postgres:
    image: postgres:16-alpine
    container_name: club-pink-black-db
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: club
      POSTGRES_PASSWORD: club_secret
      POSTGRES_DB: club_pink_black
    volumes:
      - club_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U club -d club_pink_black']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  club_pg_data:
